<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="utf-8">
  <title>Media preview</title>
  <style>
    :root { color-scheme: dark; --fg: #c9d1d9; --muted: #8b949e; --border: #30363d; --card: #161b22; --link: #58a6ff; }
    html.light { color-scheme: light; --fg: #1f2328; --muted: #59636e; --border: #d1d9e0; --card: #f6f8fa; --link: #0969da; }

    html,
    body { margin: 0; padding: 0; height: 100%; background: transparent; }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--fg);
      overflow: hidden;
    }

    video,
    audio { width: 100%; outline: none; }

    video { max-height: 100%; background: #000; border-radius: 6px; }

    .card {
      padding: 18px 20px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      text-align: center;
      font-size: 13px;
      line-height: 1.6;
      color: var(--muted);
    }

    .card a { color: var(--link); font-weight: 600; }
  </style>
</head>

<body>
  <div class="card" id="error" hidden>
    <p id="error-message" style="margin:0 0 10px">This file could not be played in the browser.</p>
    <a id="error-link" href="#" target="_blank" rel="noopener noreferrer">Open the raw file</a>
  </div>

  <script src="viewer-media.js"></script>
</body>

</html>
