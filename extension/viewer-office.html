<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="utf-8">
  <title>Document preview</title>
  <style>
    :root { color-scheme: dark; --border: #30363d; --card: #161b22; --fg: #c9d1d9; --muted: #8b949e; --link: #58a6ff; }
    html.light { color-scheme: light; --border: #d1d9e0; --card: #f6f8fa; --fg: #1f2328; --muted: #59636e; --link: #0969da; }

    html,
    body { margin: 0; padding: 0; height: 100%; }

    body {
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #fff;
    }

    iframe { flex: 1 1 auto; width: 100%; border: 0; background: #fff; }

    .note {
      flex-shrink: 0;
      padding: 10px 14px;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
      color: var(--muted);
      background: var(--card);
      border-top: 1px solid var(--border);
    }

    .note a { color: var(--link); font-weight: 600; }
  </style>
</head>

<body>
  <iframe id="viewer" title="Document preview" referrerpolicy="no-referrer"></iframe>
  <div class="note">
    Rendered by Microsoft's online viewer, which cannot open private repositories.
    <a id="raw-link" href="#" download>Download the file</a> instead.
  </div>

  <script src="viewer-office.js"></script>
</body>

</html>
